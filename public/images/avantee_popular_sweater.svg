<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <!-- Sky & Beach Background Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#BAE6FD"/>
      <stop offset="45%" stop-color="#E0F2FE"/>
      <stop offset="55%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <!-- Sea Water Gradient -->
    <linearGradient id="seaGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="50%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <!-- Sand Ground Gradient -->
    <linearGradient id="sandGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <!-- Kraft Label Gradient -->
    <linearGradient id="kraftGradPop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2C290"/>
      <stop offset="50%" stop-color="#CFA870"/>
      <stop offset="100%" stop-color="#B88E52"/>
    </linearGradient>

    <!-- Black Spool Gradient -->
    <linearGradient id="blackSpoolGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#09100D"/>
      <stop offset="30%" stop-color="#18221D"/>
      <stop offset="70%" stop-color="#24332B"/>
      <stop offset="100%" stop-color="#09100D"/>
    </linearGradient>

    <filter id="shadowHeavy" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Sky Background -->
  <rect x="0" y="0" width="1200" height="420" fill="url(#skyGrad)"/>

  <!-- Sea Water -->
  <rect x="0" y="380" width="1200" height="90" fill="url(#seaGrad)" opacity="0.85"/>
  <path d="M 0 430 Q 300 420 600 435 T 1200 430 L 1200 470 L 0 470 Z" fill="#E0F2FE" opacity="0.6"/>

  <!-- Sand Ground -->
  <rect x="0" y="460" width="1200" height="340" fill="url(#sandGrad)"/>

  <!-- Mannequin Stand & Black V-Neck Sweater -->
  <g filter="url(#shadowHeavy)">
    <!-- Wooden Mannequin Neck Pole -->
    <rect x="680" y="110" width="40" height="70" fill="#B45309" rx="6"/>
    <ellipse cx="700" cy="110" rx="28" ry="12" fill="#D97706"/>

    <!-- Black V-Neck Sweater Body -->
    <path d="M 540 180 
             C 580 170, 820 170, 860 180 
             L 940 340 L 870 360 L 840 280 
             L 830 650 L 570 650 L 560 280 
             L 530 360 L 460 340 Z" fill="#18181B"/>

    <!-- Sweater Ribbed Texture & Collar V-Shape -->
    <path d="M 640 175 L 700 280 L 760 175 Z" fill="#E2E8F0"/>
    <path d="M 650 175 L 700 260 L 750 175 Z" fill="#18181B"/>
  </g>

  <!-- Black Recycled Fabric Waste Pile on Sand Left -->
  <path d="M 280 620 C 320 570, 440 580, 480 630 C 500 660, 420 720, 310 710 Z" fill="#09090B" opacity="0.9" filter="url(#shadowHeavy)"/>

  <!-- Large Central Black Recycled Yarn Spool -->
  <g filter="url(#shadowHeavy)">
    <ellipse cx="600" cy="460" rx="135" ry="22" fill="#09100D"/>
    <path d="M 465 460 L 480 750 C 480 772, 720 772, 720 750 L 735 460 Z" fill="url(#blackSpoolGrad)"/>

    <!-- Kraft Paper Label Band -->
    <g>
      <path d="M 470 530 L 476 680 C 476 698, 724 698, 724 680 L 730 530 Z" fill="url(#kraftGradPop)" stroke="#92400E" stroke-width="1.5"/>

      <!-- Label Text -->
      <text x="600" y="575" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-weight="900" font-size="34" fill="#1C1917" text-anchor="middle" letter-spacing="3">AVANTEE™</text>
      <text x="600" y="610" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-weight="800" font-size="25" fill="#78350F" text-anchor="middle" letter-spacing="1">Popular</text>
      
      <!-- Divider -->
      <line x1="510" y1="624" x2="690" y2="624" stroke="#78350F" stroke-width="1.5" stroke-dasharray="4 2"/>

      <text x="600" y="644" font-family="sans-serif" font-weight="700" font-size="13" fill="#44403C" text-anchor="middle">Recycled Cotton 60% | Recycled Polyester 40%</text>
      <text x="600" y="662" font-family="sans-serif" font-weight="600" font-size="11" fill="#78350F" text-anchor="middle">100% GRS Certified • 120+ Pre-Dyed Shades</text>
    </g>

    <!-- Top Core Hole -->
    <ellipse cx="600" cy="460" rx="32" ry="9" fill="#000000"/>
  </g>

  <!-- Blue PET Bottles on Sand Ground -->
  <g filter="url(#shadowHeavy)">
    <!-- Bottle 1 -->
    <rect x="740" y="720" width="80" height="30" rx="10" fill="#38BDF8" opacity="0.85"/>
    <rect x="815" y="726" width="15" height="18" rx="3" fill="#0284C7"/>
    <!-- Bottle 2 -->
    <rect x="790" y="745" width="85" height="32" rx="10" fill="#0284C7" opacity="0.85"/>
    <rect x="870" y="752" width="16" height="18" rx="3" fill="#0369A1"/>
  </g>
</svg>
