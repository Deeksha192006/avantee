<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <!-- Photorealistic Soft Bokeh Background -->
    <radialGradient id="studioLighting" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#E6F4EA"/>
      <stop offset="40%" stop-color="#A8E0BC"/>
      <stop offset="75%" stop-color="#2D7A50"/>
      <stop offset="100%" stop-color="#0E3B2E"/>
    </radialGradient>

    <!-- Wood Texture Gradient for Hanger & Base -->
    <linearGradient id="realWoodGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B4513"/>
      <stop offset="25%" stop-color="#CD853F"/>
      <stop offset="50%" stop-color="#A0522D"/>
      <stop offset="75%" stop-color="#D2691E"/>
      <stop offset="100%" stop-color="#5C2E0B"/>
    </linearGradient>

    <!-- Photorealistic Kraft Paper Gradient -->
    <linearGradient id="kraftReal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EED5B7"/>
      <stop offset="35%" stop-color="#D7B280"/>
      <stop offset="70%" stop-color="#C59B63"/>
      <stop offset="100%" stop-color="#9C733B"/>
    </linearGradient>

    <!-- Photorealistic Emerald Spool Gradient -->
    <linearGradient id="emeraldSpool3D" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#042F1E"/>
      <stop offset="20%" stop-color="#0F5B38"/>
      <stop offset="50%" stop-color="#1E8C56"/>
      <stop offset="80%" stop-color="#0F5B38"/>
      <stop offset="100%" stop-color="#032115"/>
    </linearGradient>

    <!-- Hoodie 3D Fabric Shading -->
    <linearGradient id="hoodie3D" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="30%" stop-color="#10B981"/>
      <stop offset="70%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <!-- Micro Fabric Knit Pattern -->
    <pattern id="knitPattern" width="6" height="6" patternUnits="userSpaceOnUse">
      <path d="M 0 3 Q 3 0, 6 3 Q 3 6, 0 3" fill="none" stroke="#047857" stroke-width="0.75" opacity="0.4"/>
    </pattern>
    <pattern id="yarnThreadPattern" width="10" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="2" x2="10" y2="2" stroke="#065F46" stroke-width="1.2" opacity="0.5"/>
    </pattern>

    <!-- Soft Depth Ambient Shadows -->
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="15"/>
      <feOffset dx="0" dy="18" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.4"/>
      </feComponentTransfer>
      <feMerge> 
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="heavyStudioShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="28"/>
      <feOffset dx="0" dy="25" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.55"/>
      </feComponentTransfer>
      <feMerge> 
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Studio Background -->
  <rect width="1200" height="800" fill="url(#studioLighting)"/>

  <!-- Blurred Background Bokeh Orbs -->
  <g opacity="0.25">
    <circle cx="200" cy="180" r="140" fill="#A7F3D0" filter="blur(40px)"/>
    <circle cx="1000" cy="220" r="160" fill="#6EE7B7" filter="blur(50px)"/>
    <circle cx="150" cy="650" r="120" fill="#34D399" filter="blur(45px)"/>
    <circle cx="1050" cy="620" r="150" fill="#10B981" filter="blur(45px)"/>
  </g>

  <!-- Real Wooden Hanger & Metal Hook -->
  <g filter="url(#softShadow)">
    <!-- Hook -->
    <path d="M 600 75 C 600 45, 625 35, 610 20 C 595 5, 580 20, 580 40" fill="none" stroke="#71717A" stroke-width="7" stroke-linecap="round"/>
    <circle cx="580" cy="40" r="5" fill="#A1A1AA"/>
    <!-- Hanger Wood Body -->
    <path d="M 600 70 L 460 142 C 445 150, 445 162, 460 162 L 740 162 C 755 162, 755 150, 740 142 Z" fill="url(#realWoodGrad)"/>
    <path d="M 460 162 L 740 162 L 740 165 L 460 165 Z" fill="#3A1C07"/>
  </g>

  <!-- 3D Realistic Green Hoodie Garment -->
  <g filter="url(#softShadow)">
    <!-- Hoodie Base Shape -->
    <path d="M 465 155 
             C 425 178, 350 270, 295 415 
             C 280 455, 310 475, 345 465 
             C 380 450, 415 355, 435 305 
             L 435 600 C 435 625, 445 635, 470 635 
             L 730 635 C 755 635, 765 625, 765 600 
             L 765 305 
             C 785 355, 820 450, 855 465 
             C 890 475, 920 455, 905 415 
             C 850 270, 775 178, 735 155 
             Z" fill="url(#hoodie3D)"/>
    
    <!-- Micro Texture Overlay -->
    <path d="M 435 305 L 435 600 L 765 600 L 765 305 Z" fill="url(#knitPattern)"/>

    <!-- 3D Folds & Shading Highlights -->
    <path d="M 435 305 Q 460 450, 470 635" fill="none" stroke="#022C22" stroke-width="4" opacity="0.35"/>
    <path d="M 765 305 Q 740 450, 730 635" fill="none" stroke="#022C22" stroke-width="4" opacity="0.35"/>
    <path d="M 600 210 L 600 635" fill="none" stroke="#022C22" stroke-width="3" opacity="0.2"/>

    <!-- Hood Collar & Interior -->
    <path d="M 515 155 C 515 235, 685 235, 685 155 C 650 138, 550 138, 515 155 Z" fill="#047857"/>
    <path d="M 535 160 C 535 220, 665 220, 665 160 Z" fill="#022C22" opacity="0.6"/>

    <!-- White Metal Grommets & Drawstrings -->
    <circle cx="560" cy="195" r="5" fill="#E4E4E7" stroke="#71717A" stroke-width="1.5"/>
    <circle cx="640" cy="195" r="5" fill="#E4E4E7" stroke="#71717A" stroke-width="1.5"/>
    <path d="M 560 195 Q 555 240, 565 290" stroke="#F4F4F5" stroke-width="4.5" stroke-linecap="round" fill="none"/>
    <path d="M 640 195 Q 645 235, 635 275" stroke="#F4F4F5" stroke-width="4.5" stroke-linecap="round" fill="none"/>
    <!-- Aglets -->
    <rect x="562" y="290" width="4" height="12" rx="1" fill="#A1A1AA"/>
    <rect x="632" y="275" width="4" height="12" rx="1" fill="#A1A1AA"/>

    <!-- Kangaroo Pocket -->
    <path d="M 490 470 L 710 470 L 730 580 C 730 590, 720 595, 710 595 L 490 595 C 480 595, 470 590, 470 580 Z" fill="#046C4E" opacity="0.75"/>
    <path d="M 490 470 L 470 580" stroke="#022C22" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 710 470 L 730 580" stroke="#022C22" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <!-- Soft Ground Shadow for Spool & Raw Cotton -->
  <ellipse cx="600" cy="725" rx="180" ry="30" fill="#021E15" opacity="0.6" filter="blur(15px)"/>

  <!-- 3D Large Central Recycled Emerald Yarn Spool -->
  <g filter="url(#heavyStudioShadow)">
    <!-- Bottom Rim Oval Base -->
    <ellipse cx="600" cy="710" rx="130" ry="24" fill="#011910"/>

    <!-- Spool Body -->
    <path d="M 470 370 L 470 710 C 470 732, 730 732, 730 710 L 730 370 Z" fill="url(#emeraldSpool3D)"/>
    <path d="M 470 370 L 470 710 L 730 710 L 730 370 Z" fill="url(#yarnThreadPattern)"/>

    <!-- Top Rim Oval -->
    <ellipse cx="600" cy="370" rx="130" ry="24" fill="#0D4B2D"/>
    <ellipse cx="600" cy="370" rx="122" ry="20" fill="#052E1B"/>

    <!-- Top Center Wooden Core Pole -->
    <ellipse cx="600" cy="370" rx="35" ry="9" fill="url(#realWoodGrad)"/>
    <ellipse cx="600" cy="370" rx="22" ry="5" fill="#271203"/>

    <!-- Photorealistic Kraft Paper Label Band -->
    <g>
      <path d="M 467 465 L 467 625 C 467 645, 733 645, 733 625 L 733 465 Z" fill="url(#kraftReal)" stroke="#92400E" stroke-width="1.5"/>

      <!-- Inner Gold Foil Border -->
      <path d="M 477 475 L 477 615 C 477 632, 723 632, 723 615 L 723 475 Z" fill="none" stroke="#D97706" stroke-width="1" stroke-dasharray="6 3"/>

      <!-- Company Name Text -->
      <text x="600" y="518" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-weight="900" font-size="36" fill="#1C1917" text-anchor="middle" letter-spacing="3">AVANTEE™</text>
      <text x="600" y="554" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-weight="800" font-size="26" fill="#065F46" text-anchor="middle" letter-spacing="1">Signature</text>
      
      <!-- Decorative Stamp Divider -->
      <line x1="510" y1="568" x2="690" y2="568" stroke="#78350F" stroke-width="1.5"/>
      <circle cx="600" cy="568" r="4" fill="#78350F"/>

      <!-- Specifications Text -->
      <text x="600" y="590" font-family="'Inter', sans-serif" font-weight="700" font-size="13" fill="#292524" text-anchor="middle">Recycled Cotton 60% | Sustainable Viscose 40%</text>
      <text x="600" y="608" font-family="'Inter', sans-serif" font-weight="700" font-size="11" fill="#78350F" text-anchor="middle">100% GRS Certified • OEKO-TEX 100 • Zero Water</text>
    </g>
  </g>

  <!-- Photorealistic Raw White Cotton Bolls on Ground Right -->
  <g filter="url(#softShadow)">
    <circle cx="810" cy="710" r="18" fill="#F4F4F5"/>
    <circle cx="830" cy="695" r="22" fill="#FFFFFF"/>
    <circle cx="850" cy="715" r="19" fill="#FAFAFA"/>
    <path d="M 830 720 Q 825 735, 840 740" fill="none" stroke="#78350F" stroke-width="3"/>
  </g>
</svg>
