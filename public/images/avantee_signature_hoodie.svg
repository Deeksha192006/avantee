<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C6F6D5"/>
      <stop offset="50%" stop-color="#9AE6B4"/>
      <stop offset="100%" stop-color="#48BB78"/>
    </linearGradient>

    <!-- Kraft Paper Label Gradient -->
    <linearGradient id="kraftGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2C290"/>
      <stop offset="50%" stop-color="#CFA870"/>
      <stop offset="100%" stop-color="#B88E52"/>
    </linearGradient>

    <!-- Spool Texture Gradient -->
    <linearGradient id="spoolGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14532D"/>
      <stop offset="30%" stop-color="#166534"/>
      <stop offset="70%" stop-color="#15803D"/>
      <stop offset="100%" stop-color="#0F5128"/>
    </linearGradient>

    <!-- Hoodie Shadow -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#061A14" flood-opacity="0.25"/>
    </filter>
    <filter id="spoolShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="url(#bgGrad)"/>

  <!-- Floating Green Leaves Background Ornaments -->
  <g opacity="0.35">
    <path d="M150 120 C 180 80, 240 100, 220 160 C 180 200, 120 180, 150 120 Z" fill="#2F855A"/>
    <path d="M1020 180 C 1060 140, 1120 160, 1100 220 C 1050 260, 990 230, 1020 180 Z" fill="#276749"/>
    <path d="M80 620 C 120 580, 180 600, 160 660 C 110 700, 50 670, 80 620 Z" fill="#2F855A"/>
    <path d="M1080 580 C 1120 540, 1170 560, 1150 620 C 1100 660, 1040 630, 1080 580 Z" fill="#276749"/>
  </g>

  <!-- Wooden Hanger -->
  <g filter="url(#dropShadow)">
    <!-- Hook -->
    <path d="M 600 80 C 600 50, 620 40, 610 30 C 600 20, 585 30, 585 45" fill="none" stroke="#78350F" stroke-width="6" stroke-linecap="round"/>
    <!-- Hanger Frame -->
    <path d="M 600 75 L 470 140 C 460 145, 460 155, 470 155 L 730 155 C 740 155, 740 145, 730 140 Z" fill="#B45309"/>
  </g>

  <!-- Green Hoodie Garment -->
  <g filter="url(#dropShadow)">
    <!-- Body & Sleeves -->
    <path d="M 465 150 
             C 430 170, 360 260, 310 400 
             C 295 440, 320 460, 350 450 
             C 380 440, 420 340, 435 300 
             L 435 590 C 435 610, 445 620, 465 620 
             L 735 620 C 755 620, 765 610, 765 590 
             L 765 300 
             C 780 340, 820 440, 850 450 
             C 880 460, 905 440, 890 400 
             C 840 260, 770 170, 735 150 
             Z" fill="#34D399"/>
    <!-- Hoodie Texture Overlay -->
    <path d="M 435 300 L 435 590 L 765 590 L 765 300 Z" fill="#059669" opacity="0.25"/>
    
    <!-- Hood Collar & Drawstrings -->
    <path d="M 520 150 C 520 220, 680 220, 680 150 C 650 135, 550 135, 520 150 Z" fill="#10B981"/>
    <path d="M 560 190 L 560 280" stroke="#ECFDF5" stroke-width="5" stroke-linecap="round"/>
    <path d="M 640 190 L 640 270" stroke="#ECFDF5" stroke-width="5" stroke-linecap="round"/>
    
    <!-- Kangaroo Pocket -->
    <path d="M 500 460 L 700 460 L 720 570 L 480 570 Z" fill="#059669" opacity="0.5"/>
  </g>

  <!-- Large Central Recycled Yarn Spool -->
  <g filter="url(#spoolShadow)">
    <!-- Top Oval Base of Spool -->
    <ellipse cx="600" cy="380" rx="140" ry="24" fill="#064E3B"/>

    <!-- Main Spool Body -->
    <path d="M 460 380 L 475 700 C 475 725, 725 725, 725 700 L 740 380 Z" fill="url(#spoolGrad)"/>

    <!-- Yarn Thread Winding Lines -->
    <g stroke="#047857" stroke-width="2" opacity="0.6">
      <line x1="462" y1="410" x2="738" y2="410"/>
      <line x1="465" y1="430" x2="735" y2="430"/>
      <line x1="468" y1="450" x2="732" y2="450"/>
      <line x1="470" y1="630" x2="730" y2="630"/>
      <line x1="472" y1="650" x2="728" y2="650"/>
      <line x1="474" y1="670" x2="726" y2="670"/>
    </g>

    <!-- Kraft Paper Label Band -->
    <g>
      <path d="M 467 470 L 472 610 C 472 628, 728 628, 728 610 L 733 470 Z" fill="url(#kraftGrad)" stroke="#A16207" stroke-width="1.5"/>

      <!-- Label Branding Content -->
      <text x="600" y="515" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-weight="900" font-size="34" fill="#1C1917" text-anchor="middle" letter-spacing="3">AVANTEE™</text>
      <text x="600" y="548" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-weight="800" font-size="24" fill="#064E3B" text-anchor="middle" letter-spacing="1">Signature</text>
      
      <!-- Divider Line -->
      <line x1="510" y1="560" x2="690" y2="560" stroke="#78350F" stroke-width="1.5" stroke-dasharray="4 2"/>

      <!-- Specs Text -->
      <text x="600" y="580" font-family="sans-serif" font-weight="700" font-size="13" fill="#44403C" text-anchor="middle">Recycled Cotton 60% | Sustainable Viscose 40%</text>
      <text x="600" y="598" font-family="sans-serif" font-weight="600" font-size="11" fill="#78350F" text-anchor="middle">100% GRS Certified • OEKO-TEX 100 • Zero Water</text>
    </g>

    <!-- Top Spool Core Hole -->
    <ellipse cx="600" cy="380" rx="35" ry="10" fill="#022C22"/>
  </g>
</svg>
